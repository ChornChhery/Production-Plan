<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Animation: every 5 minutes the Teeth Doctor checks six things, repairs what it can and ends GREEN">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16233f"/></linearGradient></defs>
<rect width="960" height="420" rx="18" fill="url(#bg)"/>
<text x="480" y="36" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Teeth Doctor: a hidden check every 5 minutes</text>
<circle cx="220" cy="215" r="105" fill="none" stroke="#1e293b" stroke-width="16"/>
<circle cx="220" cy="215" r="105" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" stroke-dasharray="660" stroke-dashoffset="660" transform="rotate(-90 220 215)">
 <animate attributeName="stroke-dashoffset" values="660;0;0" keyTimes="0;0.7083;1" dur="12s" repeatCount="indefinite"/></circle>
<text x="220" y="212" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#f8fafc">5 min</text>
<text x="220" y="238" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">and at every log-on</text>
<text x="220" y="360" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">No window, no question, no focus stolen</text>
<rect x="440" y="84" width="470" height="38" rx="9" fill="#0f172a" stroke="#334155"/>
<text x="500" y="109" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0">.NET Framework 4.8</text>
