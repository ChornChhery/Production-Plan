<g opacity="0"><rect x="440" y="376" width="470" height="30" rx="8" fill="#14532d" stroke="#22c55e"/><text x="675" y="397" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#bbf7d0">GREEN - nothing more to do</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.6667;0.9667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g>
