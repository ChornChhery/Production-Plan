<rect x="440" y="132" width="470" height="38" rx="9" fill="#0f172a" stroke="#334155"/>
<text x="500" y="157" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e2e8f0">USB adapter and IP address</text>
