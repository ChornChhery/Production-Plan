<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Animation: key press on laptop 1 travels over the Ethernet cable to laptop 2 and the IN counter on the screen goes up">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16233f"/></linearGradient>
 <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
</defs>
<rect width="960" height="470" rx="18" fill="url(#bg)"/>
<text x="480" y="36" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">How Teeth counts, in 6 seconds</text>

<!-- LAPTOP 1 -->
<rect x="40" y="62" width="270" height="318" rx="14" fill="#0f1b33" stroke="#3b82f6" stroke-width="2"/>
<text x="175" y="88" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#60a5fa">LAPTOP 1 · counts IN</text>
<rect x="75" y="104" width="200" height="52" rx="12" fill="#3b82f6">
  <animate attributeName="fill" values="#3b82f6;#3b82f6;#f59e0b;#f59e0b;#3b82f6;#3b82f6" keyTimes="0;0.04;0.06;0.14;0.16;1" dur="6s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 4;0 4;0 0;0 0" keyTimes="0;0.04;0.06;0.14;0.16;1" dur="6s" repeatCount="indefinite"/>
</rect>
<text x="175" y="128" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">KEY BUTTON</text>
<text x="175" y="146" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#dbeafe">sends  P + Enter</text>
<line x1="175" y1="158" x2="175" y2="186" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="75" y="190" width="200" height="56" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="175" y="214" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fde68a">TeethSender.exe</text>
<text x="175" y="232" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#cbd5e1">+1 IN · queue in pending.txt</text>
<line x1="175" y1="248" x2="175" y2="286" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="75" y="290" width="200" height="64" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
<text x="175" y="314" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#bbf7d0">USB-Ethernet adapter</text>
<text x="175" y="333" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#dcfce7">192.168.50.1</text>
<text x="175" y="347" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#bbf7d0">(built-in port stays on the print network)</text>

<!-- CABLE -->
<line x1="275" y1="322" x2="725" y2="322" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
<text x="500" y="352" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">Ethernet cable · TCP port 5055</text>

<!-- LAPTOP 2 -->
<rect x="650" y="62" width="270" height="318" rx="14" fill="#1a1433" stroke="#a855f7" stroke-width="2"/>
<text x="785" y="88" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c084fc">LAPTOP 2 · counts OUT + screen</text>
<rect x="675" y="100" width="220" height="112" rx="8" fill="#e0f2fe" stroke="#0ea5e9"/>
<text x="765" y="118" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0c4a6e">IN</text>
<text x="850" y="118" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0c4a6e">OUT</text>
<text x="690" y="140" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0c4a6e">Plan</text><text x="765" y="140" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0c4a6e">1250</text><text x="850" y="140" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0c4a6e">1200</text>
<text x="690" y="162" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0c4a6e">Target</text><text x="765" y="162" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0c4a6e">640</text><text x="850" y="162" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0c4a6e">640</text>
<text x="690" y="188" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">Result</text>
<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">
 <text x="765" y="190">652<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.41;0.42;0.99;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
 <text x="765" y="190" fill="#16a34a" opacity="0">653<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.42;0.99;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
 <text x="850" y="190">631<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.76;0.77;0.99;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
 <text x="850" y="190" fill="#16a34a" opacity="0">632<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.77;0.99;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
</g>
<text x="785" y="206" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#075985">Teeth.exe · big screen</text>
<rect x="675" y="226" width="220" height="40" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
<text x="785" y="250" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">Barcode scanner  → +1 OUT</text>
<line x1="690" y1="246" x2="880" y2="246" stroke="#f43f5e" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.71;0.77;0.78;1" dur="6s" repeatCount="indefinite"/>
</line>
<rect x="675" y="290" width="220" height="64" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
<text x="785" y="314" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#bbf7d0">USB-Ethernet adapter</text>
<text x="785" y="333" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#dcfce7">192.168.50.2 · listens on 5055</text>
<line x1="785" y1="288" x2="785" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<!-- PACKET IN (L1 -> L2) -->
<g>
 <g opacity="0">
  <rect x="285" y="309" width="84" height="26" rx="13" fill="#f59e0b"/>
  <text x="327" y="327" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">IN 4821</text>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;350 0;350 0" keyTimes="0;0.15;0.38;1" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.149;0.15;0.38;0.39;1" dur="6s" repeatCount="indefinite"/>
 </g>
</g>
<!-- PACKET OK (L2 -> L1) -->
<g opacity="0">
 <rect x="580" y="309" width="84" height="26" rx="13" fill="#22c55e"/>
 <text x="622" y="327" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#052e16">OK 4821</text>
 <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-350 0;-350 0" keyTimes="0;0.45;0.68;1" dur="6s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.449;0.45;0.68;0.69;1" dur="6s" repeatCount="indefinite"/>
</g>

<!-- link light -->
<circle cx="395" cy="294" r="6" fill="#22c55e"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="410" y="298" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#86efac">PING / PONG every 2 s · Connected</text>

<!-- FOOTER -->
<rect x="40" y="396" width="880" height="56" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="480" y="418" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">Teeth saves the counts to SQLite every 3 s and writes a row to the Excel log at every shift change.</text>
<text x="480" y="438" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#cbd5e1">No OK back? The press waits in pending.txt and is re-sent. The same id is counted only once.</text>
</svg>